<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Connecting…</title></head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const connectionId = params.get('connection_id');
  const error = params.get('error');

  if (window.opener) {
    window.opener.postMessage(
      { type: 'DATABRICKS_OAUTH_RESULT', connectionId, error: error || null },
      window.location.origin
    );
    window.close();
  } else {
    // Fallback: no opener (e.g. redirect flow instead of popup)
    if (connectionId) {
      window.location.href = '/?oauth_connection_id=' + connectionId;
    } else {
      window.location.href = '/?oauth_error=' + encodeURIComponent(error || 'unknown');
    }
  }
</script>
</body>
</html>
